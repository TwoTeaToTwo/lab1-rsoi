services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    environment:
      DATABASE_URL: postgresql+asyncpg://program:test@postgres:5432/persons
    ports:
      - "8000:8000"
    volumes:
      - ./app:/service/app
      - ./migrations:/service/migrations
      - ./alembic.ini:/service/alembic.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U program -d persons"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  postgres-data: