name: GitHub Classroom Workflow

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run unit tests
        run: uv run pytest -q

      - name: Set image name
        id: image
        shell: bash
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "url=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.render
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deployment
        id: render-deploy
        if: >-
          github.event_name == 'push' &&
          vars.RENDER_DEPLOY_ENABLED == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          IMAGE_URL: ${{ steps.image.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --request POST \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Content-Type: application/json" \
              --data "$(jq -n --arg image "${IMAGE_URL}" \
                '{imageUrl: $image}')"
          )"

          DEPLOY_ID="$(jq -r '.id // empty' <<< "${RESPONSE}")"

          if [ -z "${DEPLOY_ID}" ]; then
            echo "Render did not return a deploy ID"
            echo "${RESPONSE}"
            exit 1
          fi

          echo "deploy_id=${DEPLOY_ID}" >> "$GITHUB_OUTPUT"

      - name: Wait for Render deployment
        if: >-
          github.event_name == 'push' &&
          vars.RENDER_DEPLOY_ENABLED == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.render-deploy.outputs.deploy_id }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..90}; do
            RESPONSE="$(
              curl \
                --fail-with-body \
                --silent \
                --show-error \
                "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
                --header "Authorization: Bearer ${RENDER_API_KEY}"
            )"

            STATUS="$(jq -r '.status // "unknown"' <<< "${RESPONSE}")"
            echo "Render deployment status: ${STATUS}"

            case "${STATUS}" in
              live)
                echo "Render deployment completed"
                exit 0
                ;;
              failed|*_failed|canceled|deactivated)
                echo "Render deployment failed with status: ${STATUS}"
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for Render deployment"
          exit 1

      - name: Run API Tests
        if: >-
          github.event_name == 'push' &&
          vars.RENDER_DEPLOY_ENABLED == 'true'
        uses: matt-ball/newman-action@master
        with:
          collection: postman/[inst] Lab1.postman_collection.json
          environment: postman/[inst][heroku] Lab1.postman_environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'

      - name: Autograding
        if: >-
          github.event_name == 'push' &&
          vars.RENDER_DEPLOY_ENABLED == 'true'
        uses: education/autograding@v1
        continue-on-error: true

      - name: Github auto grader mark
        if: >-
          github.event_name == 'push' &&
          vars.RENDER_DEPLOY_ENABLED == 'true'
        uses: Romanow/google-sheet-autograder-marker@v1.0
        with:
          google_token: ${{ secrets.GOOGLE_API_KEY }}
          sheet_id: "1xkgjUX6Qmk7rdJG-QPOToav-HWWtthJjnShIKnw3oIY"
          homework_number: 1
          user_column: 'D'
          column_offset: 'F'
          mark: "'+"